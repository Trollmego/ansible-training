---
- name: Ahmed Medhat Test
  hosts: all
  gather_facts: false

  tasks:
    - name: Validate required Outlook inputs
      ansible.builtin.assert:
        that:
          - outlook_email is defined
          - outlook_email | length > 0
          - outlook_app_password is defined
          - outlook_app_password | length > 0
        fail_msg: "Enter your Outlook email and app password in the launch survey."
      no_log: true

    - name: Send Hello through Outlook
      community.general.mail:
        host: smtp.office365.com
        port: 587
        secure: starttls
        username: "{{ outlook_email }}"
        password: "{{ outlook_app_password }}"
        from: "{{ outlook_email }}"
        to:
          - ahmedmedhatt38@gmail.com
        subject: Ahmed Medhat Test
        body: Hello
      no_log: true

    - name: Confirm that Outlook accepted the message
      ansible.builtin.debug:
        msg: "Outlook accepted the Hello email for delivery to ahmedmedhatt38@gmail.com."
