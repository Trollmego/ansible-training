---
- name: Ahmed Medhat Test
  hosts: all
  gather_facts: false

  tasks:
    - name: Validate required Gmail inputs
      ansible.builtin.assert:
        that:
          - gmail_email is defined
          - gmail_email | length > 0
          - gmail_app_password is defined
          - gmail_app_password | length > 0
          - recipient_email is defined
          - recipient_email is regex('^[A-Za-z0-9._%+-]+@gmail\\.com$')
        fail_msg: "Enter the sender Gmail address, app password, and a valid Gmail recipient."
      no_log: true

    - name: Send Hello through Gmail
      community.general.mail:
        host: smtp.gmail.com
        port: 587
        secure: starttls
        username: "{{ gmail_email }}"
        password: "{{ gmail_app_password }}"
        from: "{{ gmail_email }}"
        to:
          - "{{ recipient_email }}"
        subject: Ahmed Medhat Test
        body: ana ahmed medhat yabny
      no_log: true

    - name: Confirm that Gmail accepted the message
      ansible.builtin.debug:
        msg: "Gmail accepted the Hello email for delivery to {{ recipient_email }}."


